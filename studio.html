<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="clarity-project-id" content="ywdgwcton1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mengmeng Wrap Studio - 个性化礼物包装纸生成器</title>
    <meta
      name="description"
      content="上传人物头像、添加可爱配饰，自定义颜色、纹路与文案，生成可高清打印的个性化礼物包装纸。"
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://mengmengwrapy.xyz/studio.html" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mengmeng Wrap Studio - 个性化礼物包装纸生成器" />
    <meta
      property="og:description"
      content="上传头像、添加配饰，自定义颜色、纹路与文案，生成可高清打印的礼物包装纸。"
    />
    <meta property="og:url" content="https://mengmengwrapy.xyz/studio.html" />
    <link rel="stylesheet" href="./styles.css?v=20260915-5" />
    <link rel="stylesheet" href="./studio.css?v=20260915-12" />
  </head>
  <body class="studio-page">
    <main class="app-shell studio-shell">
      <header class="studio-brand" aria-label="Mengmeng Wrap">
        <img src="./assets/mengmeng-wrap-logo.png" alt="Mengmeng Wrap" />
      </header>

      <section class="editor-panel studio-editor" aria-label="底部编辑区">
        <div class="panel-head editor-title">
          <h2><span>编辑</span><small>Edit</small></h2>
        </div>

        <div class="editor-section avatar-section" data-studio-panel="avatar">
          <button class="studio-panel-close" type="button" data-studio-close aria-label="关闭头像面板">
            <span class="ui-icon" data-icon="x" aria-hidden="true"></span>
          </button>
          <div class="section-title">
            <strong>头像</strong>
            <small>Avatar</small>
          </div>
          <div class="avatar-workbench">
            <div class="portrait-stage" id="portraitStage">
              <input id="personUpload" type="file" accept="image/*" />
              <input id="accessoryUpload" type="file" accept="image/*" />
              <canvas id="portraitCanvas" width="360" height="360"></canvas>
              <button class="portrait-transform" id="portraitTransform" type="button" aria-label="移动头像">
                <span class="close-handle portrait-close-handle" aria-hidden="true">
                  <span class="ui-icon" data-icon="x"></span>
                </span>
                <span class="rotate-handle portrait-rotate-handle" aria-hidden="true">
                  <span class="ui-icon" data-icon="rotate-cw"></span>
                </span>
                <span class="resize-handle portrait-resize-handle" aria-hidden="true"></span>
                <span class="box-handle box-handle-top" aria-hidden="true"></span>
                <span class="box-handle box-handle-left" aria-hidden="true"></span>
                <span class="box-handle box-handle-right" aria-hidden="true"></span>
                <span class="box-handle box-handle-bottom" aria-hidden="true"></span>
              </button>
              <div class="accessory-layer" id="accessoryLayer"></div>
              <div class="empty-state" id="emptyState">
                <span class="ui-icon empty-state-icon" data-icon="plus" aria-hidden="true"></span>
                <span>上传人物头像</span>
              </div>
            </div>

            <div class="avatar-actions">
              <div class="avatar-frame-options" aria-label="头像边框样式">
                <button class="avatar-frame-option active" type="button" data-portrait-frame="none" aria-pressed="true">
                  <span class="avatar-frame-preview avatar-frame-preview-none" aria-hidden="true"></span>
                  <span>无框</span>
                </button>
                <button class="avatar-frame-option" type="button" data-portrait-frame="circle" aria-pressed="false">
                  <span class="avatar-frame-preview avatar-frame-preview-circle" aria-hidden="true">
                    <svg viewBox="0 0 80 96">
                      <path d="M40 24c5 0 8 4 12 7 5 3 10-2 15 2 4 3 1 8 0 13-1 4 4 7 5 13 1 9-3 18-9 23-6 5-15 2-23 10-8-8-17-5-23-10-6-5-10-14-9-23 1-6 6-9 5-13-1-5-4-10 0-13 5-4 10 1 15-2 4-3 7-7 12-7Z" />
                      <path d="M40 30c5 0 7 3 11 5 4 2 8-1 11 2 3 3 0 7 0 11 0 4 4 6 4 11 1 7-2 13-7 17-5 4-12 2-19 8-7-6-14-4-19-8-5-4-8-10-7-17 0-5 4-7 4-11 0-4-3-8 0-11 3-3 7 0 11-2 4-2 6-5 11-5Z" />
                      <path d="M38 24c-5-8-12-15-20-13-5 1-5 6-1 10 6 5 14 6 21 3Zm4 0c5-8 11-14 19-12 5 1 5 6 1 10-6 5-13 5-20 2Z" />
                      <path d="M38 25c-3 6-8 13-11 20l7-3 5 5c1-9 1-16 1-20m2-2c3 6 8 13 11 19l-7-3-5 5c-1-8-1-15-1-19" />
                      <path d="M37 23c-5-2-11-5-17-7m23 7c5-2 10-5 16-7m-22 13c-2 5-4 9-6 12m12-12c2 5 4 9 6 12" />
                      <ellipse cx="40" cy="24" rx="3.3" ry="3" />
                      <path d="M14 32c-4 2-6 6-7 10m6-9 5 3m-8 1-4-1m60-4c4 2 6 6 7 10m-6-9-5 3m8 1 4-1M15 79c-4-2-7-5-8-9m7 8 5-2m-8-2-4 2m58 3c4-2 7-5 8-9m-7 8-5-2m8-2 4 2" />
                      <path d="M14 29c0 2-2 3-4 2 1 2 0 4-2 4-1-1-1-3 0-4-2 0-4-1-4-3 2-1 4 0 5 1 0-2 1-4 3-4 2 1 2 3 2 4Zm52 0c0 2 2 3 4 2-1 2 0 4 2 4 1-1 1-3 0-4 2 0 4-1 4-3-2-1-4 0-5 1 0-2-1-4-3-4-2 1-2 3-2 4ZM15 82c0-2-2-3-4-2 1-2 0-4-2-4-1 1-1 3 0 4-2 0-4 1-4 3 2 1 4 0 5-1 0 2 1 4 3 4 2-1 2-3 2-4Zm50 0c0-2 2-3 4-2-1-2 0-4 2-4 1 1 1 3 0 4 2 0 4 1 4 3-2 1-4 0-5-1 0 2-1 4-3 4-2-1-2-3-2-4Z" />
                      <path d="M68 45c4-2 5 1 2 3-2 1-4 0-3-2m-55-1c-4-2-5 1-2 3 2 1 4 0 3-2" />
                    </svg>
                  </span>
                  <span>花边框</span>
                </button>
              </div>
              <div class="accessory-picker">
                <button class="add-button" id="addAccessory" type="button">
                  <span class="ui-icon" data-icon="accessory-add" aria-hidden="true"></span>
                  <span>添加配饰</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <div class="editor-section color-section" data-studio-panel="color">
          <button class="studio-panel-close" type="button" data-studio-close aria-label="关闭颜色面板">
            <span class="ui-icon" data-icon="x" aria-hidden="true"></span>
          </button>
          <div class="section-title">
            <strong>颜色</strong>
            <small>Color</small>
          </div>
          <div class="color-row">
            <div class="swatches" id="colorSwatches" aria-label="底色选择"></div>
            <div class="custom-color-picker" id="customColorPicker">
              <button class="custom-color-trigger" id="customColorToggle" type="button" aria-label="自定义颜色">
                <span class="swatch-check ui-icon" data-icon="check" aria-hidden="true"></span>
              </button>
              <div class="custom-color-menu" id="customColorMenu" aria-label="自定义颜色类型">
                <button class="custom-color-option" id="baseColorOption" type="button">自定义底色</button>
                <button class="custom-color-option" id="patternColorOption" type="button">自定义纹路颜色</button>
              </div>
              <input id="customColor" class="visually-hidden" type="color" value="#fafcff" aria-label="自定义底色" />
              <input id="patternCustomColor" class="visually-hidden" type="color" value="#24c8ff" aria-label="自定义纹路色" />
            </div>
          </div>
        </div>

        <div class="editor-section" data-studio-panel="pattern">
          <button class="studio-panel-close" type="button" data-studio-close aria-label="关闭纹路面板">
            <span class="ui-icon" data-icon="x" aria-hidden="true"></span>
          </button>
          <div class="section-title">
            <strong>纹路</strong>
            <small>Pattern</small>
          </div>
          <div class="pattern-options" aria-label="纹路选择">
            <button class="pattern-pill" type="button" data-pattern="confetti">
              <span class="pattern-icon ui-icon" data-icon="grip" aria-hidden="true"></span>点点
            </button>
            <button class="pattern-pill active" type="button" data-pattern="stripe">
              <span class="pattern-icon ui-icon pattern-icon-stripe" data-icon="stripe" aria-hidden="true"></span>斜纹
            </button>
            <button class="pattern-pill" type="button" data-pattern="grid">
              <span class="pattern-icon ui-icon" data-icon="grid-3x3" aria-hidden="true"></span>格纹
            </button>
            <button class="pattern-pill" type="button" data-pattern="heart">
              <span class="pattern-icon ui-icon pattern-icon-heart" data-icon="heart" aria-hidden="true"></span>爱心
            </button>
            <button class="pattern-pill" type="button" data-pattern="star">
              <span class="pattern-icon ui-icon pattern-icon-star" data-icon="star" aria-hidden="true"></span>星星
            </button>
          </div>
          <select id="patternSelect" class="visually-hidden" tabindex="-1" aria-hidden="true">
            <option value="confetti">点点</option>
            <option value="stripe">斜纹</option>
            <option value="grid">格纹</option>
            <option value="heart">爱心</option>
            <option value="star">星星</option>
          </select>
        </div>

        <div class="editor-section" data-studio-panel="text">
          <button class="studio-panel-close" type="button" data-studio-close aria-label="关闭文案面板">
            <span class="ui-icon" data-icon="x" aria-hidden="true"></span>
          </button>
          <div class="section-title">
            <strong>文案</strong>
            <small>Text</small>
          </div>
          <div class="text-controls">
            <textarea id="copyText" rows="3">happy brithday</textarea>
            <div class="copy-style-controls">
              <label class="copy-option copy-color-control">
                <span>字体颜色</span>
                <input id="copyColor" type="color" value="#050505" aria-label="字体颜色" />
              </label>
              <label class="copy-size-control">
                <span>文字大小</span>
                <input id="copySize" type="range" min="10" max="28" value="14" />
              </label>
              <div class="copy-option copy-position-control">
                <span>文字位置</span>
                <div class="position-sliders">
                  <label>
                    <span>横</span>
                    <input id="copyOffsetX" type="range" min="-60" max="60" value="0" aria-label="文字横向位置" />
                  </label>
                  <label>
                    <span>纵</span>
                    <input id="copyOffsetY" type="range" min="-60" max="90" value="0" aria-label="文字纵向位置" />
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="editor-section studio-font-section" data-studio-panel="font">
          <button class="studio-panel-close" type="button" data-studio-close aria-label="关闭字体面板">
            <span class="ui-icon" data-icon="x" aria-hidden="true"></span>
          </button>
          <div class="section-title">
            <strong>字体</strong>
            <small>Font</small>
          </div>
          <div class="font-options studio-font-options" aria-label="字体选择">
            <button class="font-option" type="button" data-copy-font="fredoka" aria-pressed="true">
              <span class="font-option-name">Fredoka</span>
              <span class="font-option-preview font-preview-fredoka">happy birthday</span>
            </button>
            <button class="font-option" type="button" data-copy-font="dynapuff" aria-pressed="false">
              <span class="font-option-name">DynaPuff</span>
              <span class="font-option-preview font-preview-dynapuff">happy birthday</span>
            </button>
            <button class="font-option" type="button" data-copy-font="sour-gummy" aria-pressed="false">
              <span class="font-option-name">Sour Gummy</span>
              <span class="font-option-preview font-preview-sour-gummy">happy birthday</span>
            </button>
            <button class="font-option" type="button" data-copy-font="baloo-2" aria-pressed="false">
              <span class="font-option-name">Baloo 2</span>
              <span class="font-option-preview font-preview-baloo-2">happy birthday</span>
            </button>
            <select id="copyFont" class="visually-hidden" tabindex="-1" aria-hidden="true">
              <option value="fredoka" selected>Fredoka</option>
              <option value="dynapuff">DynaPuff</option>
              <option value="sour-gummy">Sour Gummy</option>
              <option value="baloo-2">Baloo 2</option>
            </select>
          </div>
        </div>

        <div class="editor-section" data-studio-panel="density">
          <button class="studio-panel-close" type="button" data-studio-close aria-label="关闭画纸设置面板">
            <span class="ui-icon" data-icon="x" aria-hidden="true"></span>
          </button>
          <div class="section-title">
            <strong>画纸设置</strong>
            <small>Paper</small>
          </div>
          <div class="paper-settings">
            <label class="field field-inline">
              <select id="paperSizeSelect">
                <option value="cm-70-50">小号 · 70 × 50 cm（书本 / 小礼盒）</option>
                <option value="cm-90-60">标准 · 90 × 60 cm（鞋盒大小）</option>
                <option value="cm-100-70">大号 · 100 × 70 cm（大礼盒）</option>
                <option value="cm-120-80">加大 · 120 × 80 cm（组合礼盒）</option>
              </select>
            </label>
            <label class="slider-row">
              <span>重复密度</span>
              <input id="repeatDensity" type="range" min="90" max="190" value="158" />
            </label>
            <label class="slider-row">
              <span>图案大小</span>
              <input id="paperImageScale" type="range" min="38" max="110" step="0.1" value="81.2" />
            </label>
          </div>
        </div>

        <nav class="studio-tool-nav" aria-label="包装纸编辑工具">
          <button type="button" data-studio-tool="avatar" aria-expanded="false">
            <span class="studio-tool-icon ui-icon" data-icon="avatar-upload" aria-hidden="true"></span>
            <span>头像</span>
          </button>
          <button type="button" data-studio-tool="color" aria-expanded="false">
            <span class="studio-tool-color" aria-hidden="true"></span>
            <span>颜色</span>
          </button>
          <button type="button" data-studio-tool="pattern" aria-expanded="false">
            <span class="studio-tool-icon ui-icon" data-icon="stripe" aria-hidden="true"></span>
            <span>纹路</span>
          </button>
          <button type="button" data-studio-tool="text" aria-expanded="false">
            <span class="studio-tool-glyph" aria-hidden="true">T</span>
            <span>文案</span>
          </button>
          <button type="button" data-studio-tool="font" aria-expanded="false">
            <span class="studio-tool-glyph studio-tool-glyph-wide" aria-hidden="true">Aa</span>
            <span>字体</span>
          </button>
          <button type="button" data-studio-tool="density" aria-expanded="false">
            <span class="studio-tool-icon ui-icon" data-icon="grid-3x3" aria-hidden="true"></span>
            <span>密度</span>
          </button>
        </nav>
      </section>

      <section class="preview-panel studio-preview" aria-label="图纸预览区">
        <div class="preview-toolbar">
          <div>
            <h2><span>预览</span><small>Preview</small></h2>
          </div>
          <div class="preview-toolbar-actions">
            <button class="preview-detail-trigger" id="previewDetailOpen" type="button" aria-haspopup="dialog">
              <span class="ui-icon" data-icon="maximize-2" aria-hidden="true"></span>
              <span>放大查看</span>
            </button>
            <button id="downloadBtn" type="button">
              <span class="ui-icon" data-icon="download" aria-hidden="true"></span>
              <span>下载图纸</span>
            </button>
          </div>
        </div>
        <div class="preview-home-host" id="previewHomeHost">
          <div class="paper-preview-shell">
            <div class="paper-frame">
              <canvas id="paperCanvas" width="1120" height="760"></canvas>
            </div>
          </div>
        </div>
      </section>
      <div class="poster-shape shape-purple" aria-hidden="true"></div>
      <div class="poster-shape shape-lime" aria-hidden="true"></div>
      <div class="poster-shape shape-blue" aria-hidden="true"></div>
      <div class="poster-shape shape-orange" aria-hidden="true"></div>
    </main>

    <dialog class="preview-detail-modal" id="previewDetailModal" aria-labelledby="previewDetailTitle">
      <div class="preview-detail-surface">
        <h2 class="visually-hidden" id="previewDetailTitle">图纸详情</h2>
        <button class="preview-detail-close" id="previewDetailClose" type="button" aria-label="关闭图纸详情">
          <span class="ui-icon" data-icon="x" aria-hidden="true"></span>
        </button>
        <div class="preview-detail-canvas-host" id="previewDetailCanvasHost"></div>
        <div class="preview-detail-controls">
          <div class="preview-zoom-controls" aria-label="预览缩放">
            <button id="zoomOutBtn" type="button" title="缩小" aria-label="缩小图纸">
              <span class="zoom-symbol" aria-hidden="true">-</span>
            </button>
            <span id="zoomValue" aria-live="polite">100%</span>
            <button id="zoomInBtn" type="button" title="放大" aria-label="放大图纸">
              <span class="zoom-symbol" aria-hidden="true">+</span>
            </button>
            <button id="zoomResetBtn" type="button">
              <span class="ui-icon" data-icon="reset-view" aria-hidden="true"></span>
              <span>回位</span>
            </button>
          </div>
        </div>
      </div>
    </dialog>

    <dialog class="accessory-modal" id="accessoryModal" aria-labelledby="accessoryModalTitle">
      <div class="accessory-modal-card">
        <div class="accessory-modal-head">
          <h3 id="accessoryModalTitle">添加配饰</h3>
          <button class="accessory-modal-close" id="accessoryModalClose" type="button" aria-label="关闭配饰选择">
            <span class="ui-icon" data-icon="x" aria-hidden="true"></span>
          </button>
        </div>
        <div class="accessory-dock" aria-label="配饰选择"></div>
      </div>
    </dialog>

    <script src="./analytics.js?v=20261012-1"></script>
    <script src="./app.js?v=20260915-11"></script>
    <script src="./studio.js?v=20260915-4"></script>
  </body>
</html>
