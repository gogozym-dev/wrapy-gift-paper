  <title id="title">Elegant square bow and floral frame</title>
  <desc id="description">An editable hand-drawn floral frame with a softly folded ribbon bow.</desc>

  <style>
    .outline,
    .detail {
      fill: none;
      stroke: var(--frame-color, currentColor);
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .outline { stroke-width: var(--frame-stroke, 3.6); }
    .detail  { stroke-width: var(--detail-stroke, 2.45); }
    .accent  { fill: var(--frame-color, currentColor); }
  </style>

